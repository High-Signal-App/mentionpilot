name = "mentionpilot-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[observability]
enabled = true
head_sampling_rate = 0.1

[limits]
cpu_ms = 30000

[vars]
ENVIRONMENT = "production"
[[services]]
binding = "FREE_AI"
service = "free-ai-gateway"
entrypoint = "FleetGateway"

[triggers]
crons = ["0 6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "mentionpilot-db"
database_id = "50564400-a892-48b5-a2f9-1357fa409e0a"
migrations_dir = "../../packages/db/migrations"
