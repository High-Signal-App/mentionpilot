name = "mentionpilot-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[observability]
enabled = true
head_sampling_rate = 0.1

[limits]
cpu_ms = 30000

[vars]
ENVIRONMENT = "production"
# Free check — Fleet's OpenAI-compatible free-AI gateway. The API key is a
# Wrangler secret sourced from Infisical and is never stored in this file.
FREE_AI_ENDPOINT_URL = "https://ai-gateway.sassmaker.com/v1/chat/completions"
FREE_AI_MODEL = "auto"
# FREE_AI_API_KEY = ""
# Legacy free check keys (deprecated — use FREE_AI_* instead)
# OPENAI_API_KEY = ""
# GOOGLE_API_KEY = ""

[ai]
binding = "AI"

# Shared app-local admission for each direct Workers AI call; the gateway enforces the 9,500/day cap.
[[durable_objects.bindings]]
name = "NEURON_BUDGET"
class_name = "NeuronBudgetDO"
script_name = "free-ai-gateway"

[triggers]
crons = ["0 6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "mentionpilot-db"
database_id = "50564400-a892-48b5-a2f9-1357fa409e0a"
migrations_dir = "../../packages/db/migrations"
